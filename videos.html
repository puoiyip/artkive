        <style>
            .film {
                background-image: url("portfolio\ images/film.png");
                height: 60vh;
                width: 100vw;
                background-size: auto 100%;
            }
            .film iframe {
                height: 70%;
                margin-left: 1%;
                margin-right: 1%;
            }
            #camera {
                z-index: 1;
                position: absolute;
                object-fit: contain;
                transform: scaleX(-1);
                rotate: -20deg;
                width: 25vw;
                height: auto;
                left: -4%;
                top: 80vh;
            }
            button {
                border-bottom-left-radius: 1em;
                border-bottom-right-radius: 1em;
                margin-left: 1em;
                margin-right: 1em;
                width: 30%;
                font-weight: bold;
                z-index: 1;
            }
            h2 {
                border-style: solid;
                padding: 0.5em;
                border-width: 0em;
                border-top-width: 0.05em;
                border-bottom-width: 0.05em;
                margin-top: 3%;
                width: 90%;
                text-align: center;
                border-color: #AAAE7F;
            }
            body {
                margin-bottom: 5%;
            }
            /*POLAROIDS*/
            div .polaroid {
                width: 15%;
                height: auto;
                position: absolute; 
                top: 20%;
                border-radius: 0em ;
                transition: 1s;
                box-shadow: 5px 5px 5px #b7b6b3, -5px -5px 5px #b7b6b3;
                z-index: 0;
                rotate: -20deg;
                opacity: 30%;
            }
            div .polaroid:hover {
                cursor: default;
                opacity: 80%;
            }
            @media (max-width: 800px) {
                .film {
                    overflow-x: auto;
                }
            }
        </style>
