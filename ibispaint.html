<!DOCTYPE html>

        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <link rel="stylesheet" href="style.css"/>
        <style>
            body {
                margin-bottom: 3%;
            }
            #book-pages {
                width: 70vw;
                height: 80vh;
                background-color: transparent;
                perspective: 1000px;
                position: relative;
                transform-origin: top;
                background-image: url("portfolio images/notebook_crisp.png");
                background-repeat: no-repeat;
                background-size: cover;
                box-shadow: -5px 7px 5px #b7b6b3, 5px 5px 5px #b7b6b3
            }
            #book-pages-top, #book-pages-hidden, #book-pages-bottom {
                width: 100%;
                height: 80%;
                transition: transform 1s;
                transform-style: preserve-3d;
                transform-origin: top;
                backface-visibility: hidden;
                justify-items: center;
                align-content: center;
                position: absolute;
                z-index: 2;
                margin-top: 10.5%;
                background-color: #f5f1f2;
            }
            #book-pages-hidden {
                transition: none;
                transform: rotateX(180deg);
                z-index: 1;
            }
            #book-pages-bottom {
                z-index: 0;
            }
            #book-pages-top img, #book-pages-bottom img, #book-pages-hidden img {
                height: 60vh;
                width: auto;
                object-fit: contain;
                display: flex;
                margin: 0;
            }
            button {
                border-bottom-left-radius: 1em;
                border-bottom-right-radius: 1em;
                margin-left: 1em;
                margin-right: 1em;
                width: 30%;
                font-weight: bold;
                z-index: 1;
            }
            h2 {
                border-style: solid;
                padding: 0.5em;
                border-width: 0em;
                border-top-width: 0.05em;
                border-bottom-width: 0.05em;
                margin-top: 3%;
                width: 90%;
                text-align: center;
                border-color: #AAAE7F;
            }
            /*POLAROIDS*/
            div .polaroid {
                width: 15%;
                height: auto;
                position: absolute; 
                top: 20%;
                border-radius: 0em ;
                transition: 1s;
                box-shadow: 5px 5px 5px #b7b6b3, -5px -5px 5px #b7b6b3;
                z-index: 0;
                rotate: -20deg;
                opacity: 30%;
            }
            div .polaroid:hover {
                cursor: default;
                opacity: 80%;
            }
            @media (max-width: 800px) {
                #book-pages img {
                    width: 80vw;
                }
                #book-pages {
                    width: 90vw;
                }
            }
        </style>

        <h2>ibisPaintX</h2>
        <div id="book-pages">
            <a href="#main-content" id="main-content"></a>
            <div id="book-pages-top">
                <img src="portfolio images/chongyun_mountain.PNG" id="top-image">
            </div>
            <div id="book-pages-hidden">
                <img src="" id="hidden-image">
            </div>
            <div id="book-pages-bottom">
                <img src="" id="bottom-image">
            </div>
        </div>
        <div class="row" style="width: 100%;">
            <button onclick="previousArt()">Previous</button>
            <button onclick="nextArt()">Next</button>
        </div>
        
        <script>
            const artworks = [
                "portfolio images/chongyun_mountain.PNG",
                "portfolio images/chongyun_train.JPEG",
                "portfolio images/kazuha.jpeg",
                "portfolio images/kenma_kozume.png",
                "portfolio images/mysta_900k.jpg",
                "portfolio images/till.PNG",
                "portfolio images/tomo.jpeg",
                "portfolio images/ver_vermillion.JPG",
                "portfolio images/xingyun_lny.PNG",
                "portfolio images/xingyun_tbhk.PNG"
            ];
            const topDiv1 = document.getElementById("book-pages-top");
            const topDiv2 = document.getElementById("book-pages-hidden");
            const topImage1 = document.getElementById("top-image");
            const topImage2 = document.getElementById("hidden-image");
            const bottomImage = document.getElementById("bottom-image");
            const maxIndex = artworks.length - 1;
            let count = 0;
            let degreeCount1 = 0;
            let degreeCount2 = 180;

            //flips the top layer
            function nextArt() {
                /*degrees that are a multiple of 360 indicate that the page is "upright
                otherwise, it would be upside-down
                
                flips the upside-down layer clockwise*/
                if (degreeCount1 % 360 == 0 || degreeCount1 == 0) {
                    topDiv1.style.transformStyle = "preserve-3d";
                    topDiv1.style.transition = "transform 1s";
                    topDiv1.style.zIndex = "2";

                    topDiv2.style.transformStyle = "flat";
                    topDiv2.style.transition = "0s";
                    topDiv2.style.zIndex = "1";
                } else if (degreeCount2 % 360 == 0 || degreeCount2 == 0) {
                    topDiv1.style.transformStyle = "flat";
                    topDiv1.style.transition = "0s";
                    topDiv1.style.zIndex = "1";

                    topDiv2.style.transformStyle = "preserve-3d";
                    topDiv2.style.transition = "transform 1s";
                    topDiv2.style.zIndex = "2";
                }
                //increases the degrees by 180 to trigger animation
                incrementDegrees();
                topDiv1.style.transform = "rotateX(" + degreeCount1 + "deg)";
                topDiv2.style.transform = "rotateX(" + degreeCount2 + "deg)";
                //increments count by 1 and checks for out-of-bounds errors
                count++;
                checkReset();
                /*the upside-down layer is hidden (due to the backface-visibility property.
                changes the image of the hidden layer*/
                if (topDiv1.style.transformStyle == "flat") {
                    topImage1.src = artworks[checkValue(count)];
                } else if (topDiv2.style.transformStyle == "flat") {
                    topImage2.src = artworks[checkValue(count)];
                }
            };
            
            function previousArt() {
                //flips the visible layer counterclockwise
                if (degreeCount2 % 360 == 0 || degreeCount2 == 0) {
                    topDiv1.style.transformStyle = "preserve-3d";
                    topDiv1.style.transition = "transform 1s";
                    topDiv1.style.zIndex = "2";

                    topDiv2.style.transformStyle = "flat";
                    topDiv2.style.transition = "0s";
                    topDiv2.style.zIndex = "1";
                } else if (degreeCount1 % 360 == 0 || degreeCount1 == 0) {
                    topDiv1.style.transformStyle = "flat";
                    topDiv1.style.transition = "0s";
                    topDiv1.style.zIndex = "1";

                    topDiv2.style.transformStyle = "preserve-3d";
                    topDiv2.style.transition = "transform 1s";
                    topDiv2.style.zIndex = "2";
                }
                //decreases the degrees by 108
                decrementDegrees();
                topDiv1.style.transform = "rotateX(" + degreeCount1 + "deg)";
                topDiv2.style.transform = "rotateX(" + degreeCount2 + "deg)";
                //decrements the count by 1 and checks for out-of-bound errors
                count--;
                checkReset();
                //changes the image source of the "hidden" layer 
                if (topDiv2.style.transformStyle == "flat") {
                    topImage1.src = artworks[checkValue(count)];
                } else if (topDiv1.style.transformStyle == "flat") {
                    topImage2.src = artworks[checkValue(count)];
                }
                /*the bottom image is stationary. 
                it changes to the previous image to make the animation more seamless*/
                bottomImage.src = artworks[checkValue(count + 1)];
            };
            function incrementDegrees() {
                degreeCount1 += 180;
                degreeCount2 += 180;
            };
            function decrementDegrees() {
                degreeCount1 -= 180;
                degreeCount2 -=180;
            };
            function checkValue(number) {
                if (number > maxIndex) {
                    return 0;
                } else if (number < 0) {
                    return maxIndex;
                }
                return number;
            };
            function checkReset() {
                if (count > maxIndex) {
                    count = 0;
                } else if (count < 0) {
                    count = maxIndex;
                }
            }

        </script>
