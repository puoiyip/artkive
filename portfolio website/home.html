            .row {

                border-color: #AAAE7F;
            }
            /*BUTTON*/
            button {

                font-size: 150%;
                font-weight: bold;
                color: #45363B;
                font-family: "Limelight";
            }
            /*MODAL*/
            .modal {
                width: 100%;
                height: 100%;
                justify-content: center;
                align-content: center;
                align-items: center;
                display: flex;
                opacity: 0;
                transition-duration: 0.5s;
                z-index: -1;
                background-color:#2b2827e3
            }
            .modal img {
                height: 90%;
                width: auto;
                max-width: 70vw;
                object-fit: contain;
                margin-left: 0;
                margin-right: 0;
            }
            .modal button {
                margin: 5%;
                width: 3em;
                height: 3em;
                display: flex;
                text-align: center;
                justify-content: center;
                align-content: center;
                font-weight: bold;
                z-index: 2;
            }
            #close {
                position: absolute;
                color: #F7F7F2;
                top: 3%;
                right: 5%;
                font-size: 400%;
                font-weight: bold;
            }
            #close:hover {
                cursor: pointer;
            }
            /*POLAROIDS*/
            div .polaroid {
                width: 15em;
                height: auto;
                position: absolute;

                transition: 0s;
                box-shadow: 5px 5px 5px #b7b6b3, -5px 5px 5px #b7b6b3;
                z-index: 0;
            }
            div .polaroid:hover {
                cursor: default;
                opacity: 100%;
            }

            <script>
                //MODAL VARIABLES
                const rowArray = document.getElementsByClassName("row");
                const modal = document.getElementsByClassName("modal")[0];
                const modalImage = modal.getElementsByTagName("img")[0];
                //returns the source of the image at a specific row and image number
                function getImageSource() {
                    let imageArray = rowArray[rowCount].getElementsByTagName("img");
                    return imageArray[imageCount].src;
                };
                function test(element) {
                    console.log(element.src);
                }
                function openModal(element) {
                    //stores the source of the argument
                    let imageSource = element.src;
                    modalImage.src = imageSource;
                    //shows the modal
                    modal.style.opacity = "1";
                    modal.style.zIndex = "2";
                    /*set the rowCount and imageCount constiables to match the selected image
                    (ensures that the nextModal() and previousModal() functions work as intended)
                    
                    for each image element in the given row, check if the source is equal to the argument.
                    if this is true, set rowCount and imageCount to the current row and image*/
                    for (let i = 0; i < rowArray.length; i++) {
                            let imageArray = rowArray[i].getElementsByTagName("img");
                            for (let j = 0; j < imageArray.length; j++) {
                                let currentImageSource = imageArray[j].src;
                                if (currentImageSource == imageSource) {
                                    rowCount = i;
                                    imageCount = j;
                                };
                            };
                    };
                };
                function closeModal() {
                    modal.style.opacity = "0";
                    //set z-index to a negative value to avoid the modal interfering with the buttons
                    modal.style.zIndex = "-1";
                };
                //functions used to toggle between images when modal is already open
                function nextModal() {
                    imageCount++;
                    changeModal();
                };
                function previousModal() {
                    imageCount--;
                    changeModal();
                }
                function changeModal() {
                    //ensures that rowCount and imageCount are within the correct bounds
                    checkRowCount();
                    checkImageCount();
                    //changes the image of the modal to the image at [row, count]
                    modalImage.src = getImageSource();
                };
                //resets rowCount if it's out of bounds
                function checkRowCount() {
                    let maxIndex = rowArray.length - 1;
                    if (rowCount > maxIndex) {
                        rowCount = 0;
                    } else if (rowCount < 0) {
                        rowCount = maxIndex;
                    }
                };
                //resets imageCount if it's out of bounds
                function checkImageCount() {
                    let imageArray = rowArray[rowCount].getElementsByTagName("img");
                    let maxIndex = imageArray.length - 1;
                    //moves onto the next row and resets imageCount
                    if (imageCount > maxIndex) {
                        imageCount = 0;
                        rowCount++;
                    //moves onto the previous row 
                    } else if (imageCount < 0) {
                        imageCount = maxIndex;
                        rowCount--;
                    };
                    //ensures that there's no out of bounds error after changing rowCount
                    checkRowCount();
                };
            </script>
