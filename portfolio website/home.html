<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="home.css"/>
        <style>
            .row {
                width: 100%;
            }
            .row img {
                display: flex;
                width: 20vw;
                height: 20vw;
                object-fit: cover;
                border-radius: 5em;
                transition: 0.3s
            }
            .row img:hover {
                opacity: 60%;
                transition: 0.3s;
                cursor: pointer;
            }
            #overview {
                width: 95%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-self: center;
                background-color: #D0D6B3;
                border-radius: 5em;
                margin-top: 3%;
            }
            h2 {
                border-style: solid;
                padding: 0.5em;
                border-width: 0em;
                border-top-width: 0.05em;
                border-bottom-width: 0.05em;
                margin-top: 3%;
                width: 90%;
                text-align: center;
                border-color: #AAAE7F;
            }
            button {
                border-radius: 1em;
                font-size: 150%;
                font-weight: bold;
                color: #45363B;
                font-family: "Limelight";
            }
            #intro {
                background-color: #e6dbb8;
                padding: 2em;
                border-radius: 2em;
            }
            .circle {
                border-radius: 50%;
                aspect-ratio: 1/1;
                width: 60%;
                text-align: center;
                opacity: 50%;
            }  
            #current-icon {
                width: 90%;
                opacity: 100%;
            }
        </style>
        <!--Faculty Glyphic
        Elms Sans
        Limelight
        Kaushan Script-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Faculty+Glyphic&family=Kaushan+Script&family=Limelight&display=swap" rel="stylesheet">

        <body onload="changeIcons()">
            
            <h2>welcome to</h2>
            <h1>kelsey's artkive!</h1>

            <p id="intro">
                Hello! My name is Kelsey. Welcome to my portfolio! <br> 
                17 | her/she | eng
            </p>
            <div style="display: flex; align-items: center; width: 75%">
                <button id="left-button" onclick="leftButtonClick()"><</button>
                <a href="" style="text-align: center" id="left-link">
                    <h3></h3>
                    <img src="" class="circle" id="left-icon">
                </a>
                <a href="" style="text-align: center;" id="current-link">
                    <h3></h3>
                    <img src="" class="circle" id="current-icon">
                </a>
                <a href="" style="text-align: center" id="right-link">
                    <h3></h3>
                    <img src="" class="circle" id="right-icon">
                </a>
                <button id="right-button" onclick="rightButtonClick()">></button>
            </div>
            <h2>
                overview
            </h2>
            <div id="overview">
                <div class="row">
                    <img src="portfolio images/colorpop.png" alt="Four red pandas colored in orange and purple, green, orange, and brown">
                    <img src="portfolio images/doodlebomb.png" alt="Image of grentperez with a gray and orange gradient background, clementines, and decorations on his blazer">
                    <img src="portfolio images/fake_media.png" alt="Photo-edited image of a group of protesters in Chinatown with signs that advocate against the construction of an arena">
                    <img src="portfolio images/fantastical_beast.png" alt="Photo-edited image of a rhino-ferret-seal hybrid on a stone in a river">
                </div>
                <div class="row">
                    <img src="portfolio images/filtered_money1.png" alt="Fictional dollar bill of Link (from the Legend of Zelda) and the Hyrule logo">
                    <img src="portfolio images/filtered_money2.png" alt="Fictional dollar bill featuring the Master Sword and a korok leaf (Legend of Zelda)">
                    <img src="portfolio images/great_gatsby_cover.png" alt="A mansion located next to a lake with a broken clock behind it. The book is titled The Great Gatsby">
                    <img src="portfolio images/laufey_self_portrait.png" alt="Illustration of Laufey surrounded by white flowers">
                </div>
                <div class="row">
                    <img src="portfolio images/logo.png" alt="Coffee cup logo with the name Cozy Corner Brews">
                    <img src="portfolio images/pixel_project.png" alt="Tan pixelated inventory interface featuring a character, skills, main items, and backpack items">
                    <img src="portfolio images/product_design.png" alt="Brown Chocoluxe chocolate bar container featuring cinnamon sticks. The other side contains nutrition facts">
                    <img src="portfolio images/promotional_poster.png" alt="Poster featuring Link (from the Legend of Zelda: Tears of the Kingdom) alongside silhouettes of Rauru, Zelda, and the warriors">
                </div>
                <div class="row">
                    <img src="portfolio images/RECOVER_animation.gif" alt="Walking animation of Round 3 Ivan from Alien Stage">
                    <img src="portfolio images/talking_animation.gif" alt="Talking animation of the reversible octopus toy in a cloak with a magical staff">
                    <img src="portfolio images/chongyun_mountain.PNG" alt="Chongyun (from Genshin Impact) on top of a mountain, looking back">
                    <img src="portfolio images/chongyun_train.JPEG" alt="Chongyun (from Genshin Impact) sleeping next to a window on a train with a sunset in the background">
                </div>
                <div class="row">
                    <img src="portfolio images/kazuha.jpeg" alt="Kazuha (from Genshin Impact) reaching out to an Electro seelie">
                    <img src="portfolio images/kenma_kozume.png" alt="Kenma (from Haikyuu) sitting on a gymnasium seat with his eyes closed and face tucked into his jacket">
                    <img src="portfolio images/mysta_900k.jpg" alt="Mysta (from Nijisanji) laying down on a bed with the Mystake mascot next to him">
                    <img src="portfolio images/till.PNG" alt="Till (from Alien Stage) sitting down under a red-leaf tree petting a black cat">
                </div>
                <div class="row">
                    <img src="portfolio images/tomo.jpeg" alt="Portrait of Tomo (fan-name for a character from Genshin Impact)">
                    <img src="portfolio images/ver_vermillion.JPG" alt="Ver (from Nijisanji) slouched over a desk with his forehead resting on the back of his hands with the caption XSOLEIL'S KAICHOU :D">
                    <img src="portfolio images/xingyun_lny.PNG" alt="Xingqiu and Chongyun (from Genshin Impact) leaning on a railway in Liyue next to each other with lanterns in the background">
                    <img src="portfolio images/xingyun_tbhk.PNG" alt="Xingqiu and Chongyun (from Genshin Impact) sitting down next to each other on the grass with a sunset in the background">
                </div>
            </div>
            <script>
                //icon images
                let leftIcon = document.getElementById("left-icon");
                let currentIcon = document.getElementById("current-icon");
                let rightIcon = document.getElementById("right-icon");  
                //icon links
                let leftLink = document.getElementById("left-link");
                let currentLink = document.getElementById("current-link");
                let rightLink = document.getElementById("right-link");
                //page names
                let leftName = document.getElementsByTagName("h3")[0];
                let currentName = document.getElementsByTagName("h3")[1];
                let rightName = document.getElementsByTagName("h3")[2];
                //buttons
                var leftButton = document.getElementById("left-button");
                var rightButton = document.getElementById("right-button");
                //count
                let count = 0;
                //[page name, image]
                var icons = [
                    "portfolio images/doodlebomb.png",
                    "portfolio images/colorpop.png",
                    "portfolio images/fake_media.png",
                    "portfolio images/fantastical_beast.png"
                ];
                var htmlLinks = [
                    "ibispaint.html",
                    "photoshop.html",
                    "illustrator.html",
                    "videos.html"
                ];
                var pageNames = [
                    "ibisPaint X",
                    "Photoshop",
                    "Illustrator",
                    "Videos"
                ];
                function leftButtonClick() {
                    count--;
                    changeIcons();
                };
                function rightButtonClick() {
                    count++;
                    changeIcons();
                };
                function changeIcons() {
                    if (count >= icons.length) {
                        count = 0;
                    } else if (count < 0) {
                        count = icons.length - 1;
                    }
                    console.log("count: " + count);
                    console.log("length: " + icons.length);
                    //rotate the icon images
                    currentIcon.src = icons[checkCount(count)];
                    leftIcon.src = icons[checkCount(count - 1)];
                    rightIcon.src = icons[checkCount(count + 1)];
                    //rotate the links 
                    currentLink.href = htmlLinks[checkCount(count)];
                    leftLink.href = htmlLinks[checkCount(count - 1)];
                    rightLink.href = htmlLinks[checkCount(count + 1)];
                    //rotate the text
                    currentName.innerHTML = pageNames[checkCount(count)];
                    leftName.innerHTML = pageNames[checkCount(count - 1)];
                    rightName.innerHTML = pageNames[checkCount(count + 1)];
                };
                function checkCount(value) {
                    //greatest index that doesnt cause an index out of bounds error
                    var maxIndex = icons.length - 1;
                    //if the value is negative, set it to the max
                    if (value < 0) {
                        console.log(maxIndex);
                        return maxIndex;
                    //if the value is greater than the max, set it to 0
                    } else if (value > maxIndex) {
                        console.log(0)
                        return 0;
                    };
                    console.log(value);
                    return value;
                };
            </script>
        </body>
    </head>
</html>
